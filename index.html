<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>데이터 과학 수행평가</title>
<style>
  body { margin:0; font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif; background:#f1f5f9; color:#0f172a; line-height:1.6; }
  .wrap { max-width:640px; margin:0 auto; padding:32px 16px; }
  h1 { font-size:22px; color:#0f2a4a; margin:0 0 4px; }
  .card { background:#fff; border:1px solid #cbd5e1; border-radius:10px; padding:20px; margin-top:16px; }
  .links { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin-top:8px; }
  a.btn { display:block; text-align:center; padding:14px 0; border-radius:8px; background:#0f2a4a; color:#fff; text-decoration:none; font-size:18px; font-weight:700; }
  a.sub { display:inline-block; margin-top:12px; color:#2563eb; }
  ul { padding-left:20px; margin:8px 0 0; }
  .hint { color:#64748b; font-size:14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>데이터 과학 수행평가</h1>
  <div class="hint">OO마트 구매 데이터 분석 · 35분</div>
  <div class="card">
    <b>선생님이 알려 준 시험지 유형을 누르세요.</b>
    <div class="links">
      <a class="btn" href="A.html">A형</a>
      <a class="btn" href="B.html">B형</a>
      <a class="btn" href="C.html">C형</a>
    </div>
    <a class="sub" href="all.html">유형을 직접 선택하는 화면으로 가기</a>
  </div>
  <div class="card">
    <b>안내</b>
    <ul>
      <li>Chrome 브라우저로 응시하세요. 시크릿 창은 사용하지 마세요.</li>
      <li>시험이 끝나면 결과 파일 2개(.html, .json)가 다운로드됩니다. 선생님 안내에 따라 제출하세요.</li>
      <li>창을 실수로 닫았다면 같은 주소로 다시 들어오면 이어서 풀 수 있습니다.</li>
    </ul>
  </div>
</div>
</body>
</html>
